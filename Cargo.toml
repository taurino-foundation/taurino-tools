[package]
name = "taurino-tools"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.91"
log = "0.4.34"
tao = { version = "0.37.0", default-features = false }
dpi = { version = "0.1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
parking_lot = "0.12.5"
getrandom = { version = "0.4", features = ["std"] }


image = { version = "0.25.10", default-features = false, features = ["png", "ico"] }

# Desktop only
[target.'cfg(any(target_os = "linux",target_os = "dragonfly",target_os = "freebsd",target_os = "openbsd",target_os = "netbsd",target_os = "windows",target_os = "macos"))'.dependencies]
muda = {version = "0.21",default-features = false,features = ["serde","gtk3"]}
tray-icon = {version = "0.25",default-features = false,features = ["serde","libappindicator"]}

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [        
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
]}


